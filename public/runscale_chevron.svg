<!-- Шеврон Ранскеил. Производная от boom-cmd-data/docs/brand/runscale_chevron.svg.
     Три вещи, которые ломались по очереди и которые НЕЛЬЗЯ трогать:
     1) viewBox обрезан по границам знака. В исходнике знак жил внутри квадрата
        1080x1080 с прозрачными полями по 78px сверху и снизу, из-за чего height
        задавал бокс, а не высоту знака, и зазор до слова уплывал.
     2) ЗАЛИВКА БЕЛАЯ. Файл работает как CSS-маска, а WebKit для webkit-mask-image
        считает СВЕТЛОТУ, а не альфу: чёрный знак = светлота 0 = невидим совсем.
     3) fill-rule:evenodd. В исходнике правило заливки стояло на элементе svg, а не
        на path, и при переносе потерялось. По умолчанию действует nonzero, которое
        ЗАЛИВАЕТ внутренние вырезы: знак превращался в сплошное пятно с потерянными
        просветами между шевронами.
     Цвет знака на экране задаёт фон элемента (токен текста), а не этот файл. -->
