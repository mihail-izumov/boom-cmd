</style>

    days.push({dd,iso,dow,dowRu:DOW_RU[dow-1],weekend:dow>=6,holiday:hol.has(iso),acts:actBy[iso]||[],
      coef,weight:coef*fac,fact:f?f.rev:null,chk:f?f.chk:null,status:f?f.status:null,outlier:!!(f&&f.outlier),full});
  }
  const T=DATA.month_target||0, sumW=days.reduce((a,x)=>a+x.weight,0);
  days.forEach(x=>x.plan=T*x.weight/sumW);
  const realized=days.filter(x=>x.full), realizedRev=realized.reduce((a,x)=>a+x.fact,0);
  const pace=days.filter(x=>x.full&&!x.outlier);
  const wPace=pace.reduce((a,x)=>a+x.weight,0), impliedBase=wPace>0?pace.reduce((a,x)=>a+x.fact,0)/wPace:0;
  const remaining=days.filter(x=>!x.full), wRemain=remaining.reduce((a,x)=>a+x.weight,0);
  const remainTarget=Math.max(T-realizedRev,0), adjBase=wRemain>0?remainTarget/wRemain:0;
  days.forEach(x=>x.need=x.full?null:adjBase*x.weight);
  const landing=realizedRev+remaining.reduce((a,x)=>a+impliedBase*x.weight,0);
  const maxObsBase=pace.length?Math.max(...pace.map(x=>x.fact/x.weight)):0, achievable=adjBase<=maxObsBase*1.001;
  const planRealized=realized.reduce((a,x)=>a+x.plan,0), onPlan=planRealized>0?realizedRev/planRealized:null;
  const tailCum=planRealized-realizedRev;
  const lastFactISO=realized.length?realized[realized.length-1].iso:null;
  const futureDays=days.filter(x=>!x.full && (!lastFactISO || x.iso>lastFactISO));  // будущие незакрытые (прошлые пропуски НЕ считаем)
  const currentPace=realized.length?realizedRev/realized.length:0;
  const needPerDay=futureDays.length?remainTarget/futureDays.length:0;
  const paceGap=currentPace?needPerDay/currentPace-1:0;
  const weeks=[]; let cur=null;
  days.forEach(x=>{ if(!cur||x.dow===1){cur={days:[]};weeks.push(cur);} cur.days.push(x); });
  weeks.forEach((w,i)=>{ w.idx=i+1;
    w.plan=w.days.reduce((a,x)=>a+x.plan,0);
    w.factDays=w.days.filter(x=>x.full); w.fact=w.factDays.reduce((a,x)=>a+x.fact,0); w.hasFact=w.factDays.length>0;
    w.partOfPlan=w.factDays.reduce((a,x)=>a+x.plan,0); w.delta=w.fact-w.partOfPlan;
    w.leftDays=w.days.filter(x=>!x.full).length; w.need=w.days.filter(x=>!x.full).reduce((a,x)=>a+(x.need||0),0);
  });
  return {Y,M,DIM,days,weeks,T,realizedRev,remainTarget,remaining,landing,achievable,onPlan,tailCum,realized,
    futureDays,currentPace,needPerDay,paceGap};
}

function render(){
  const m=model(), d=DATA, cal=d.calib||{};
  const lastFact=m.realized.length?m.realized[m.realized.length-1].iso:null;
  const H=[];

  H.push(`<h1>Контроль ежедневной выручки</h1>`);
  H.push(`<div class="head-row"><span class="parkbadge">${d.park_name}</span>`+
    `<span class="month">${RU_M[d.month.slice(5)]} ${d.month.slice(0,4)}</span>`+
    `<span class="upd">обновлено ${d.generated}</span></div>`);

  // ── ГЛАВНЫЙ РЫЧАГ (опережающий индикатор) — в самом верху ──
  if(d.lead && m.currentPace>0){
    const L=d.lead;
    const arrow=L.prev_avg==null?"":(L.cur_avg<L.prev_avg?"↓ падает":L.cur_avg>L.prev_avg?"↑ растёт":"→ ровно");
    const trend=L.prev_avg!=null?`${L.prev_label} ${L.prev_avg}/день → ${L.cur_label} ${L.cur_avg}/день`:`${L.cur_label} ${L.cur_avg}/день`;
    const falling=L.prev_avg!=null && L.cur_avg<L.prev_avg;
    H.push(`<div class="insight"><div class="ins-h">⚠ Главный рычаг цели — приток «${L.name}»</div>`+
      `<p>Чтобы выйти на <b>${mln(m.T)}</b>, остаток месяца должен давать <b>${ths(m.needPerDay)}/день</b> против текущих <b>${ths(m.currentPace)}/день</b> — это <b class="bad">${pct(m.paceGap)}</b> к темпу, и стабильно до конца месяца. Сам собой такой рост не появится.</p>`+
      `<p><b>${L.name[0].toUpperCase()+L.name.slice(1)}</b> — опережающий индикатор выручки (связь r=${L.corr}), и он <b class="${falling?'bad':'good'}">${arrow}</b>: ${trend}. ${falling?`Пока приток снижается — выручка на ${pct(m.paceGap)} сама не пойдёт.`:``} Прогноз приземления при текущем темпе — <b>${mln(m.landing)}</b>, а не цель.</p>`+
      `<p class="ins-do"><b>Что нужно от команды:</b> развернуть приток новых гостей (маркетинг, узнаваемость, работа с трафиком ТЦ) и поднять средний чек. Это ключевой рычаг, чтобы закрыть разрыв до ${mln(m.T)}; без него цель — амбиция, а не план.</p></div>`);
  }

  // календарь — серая плашка с заголовком
  const wknds=m.days.filter(x=>x.weekend).map(x=>x.dd), wp=[];
  for(let i=0;i<wknds.length;i+=2) wp.push(wknds.slice(i,i+2).join("–"));
  H.push(`<div class="calpanel"><div class="ttl">Календарь месяца</div><div class="calpills">`+
    `<span class="pill">выходные: ${wp.join(", ")}</span>`+
    (d.holidays&&d.holidays.length?`<span class="pill hol">праздники: ${d.holidays.map(h=>+h.slice(8)).join(", ")}</span>`
      :`<span class="pill none">госпраздников нет</span>`)+
    `<span class="pill none">СПб, офиц. производственный календарь 2026</span></div></div>`);

  // hero
  const landDev=m.T?m.landing/m.T-1:0, fcCls=sigClass(m.landing/m.T);
  const factPct=Math.min(100,m.realizedRev/m.T*100), landPct=Math.min(100,m.landing/m.T*100);
  const gap=Math.max(0,m.T-m.landing);
  H.push(`<div class="hero"><div class="hero-top">`+
    `<div class="hero-col"><div class="lab">Цель на ${RU_M[d.month.slice(5)]} ${d.month.slice(0,4)}</div><div class="hero-target">${mln(m.T)}</div></div>`+
    `<div class="hero-col"><div class="lab">Прогноз выручки <span class="hint">при текущем темпе</span></div>`+
      `<div class="hero-fc ${fcCls}">${mln(m.landing)}<span class="hero-dev">${pct(landDev)}</span></div></div>`+
    `<div class="to-target"><span class="st ${m.achievable?'good':'bad'}">${m.achievable?"цель достижима":"⚠ без вмешательства не выйдем"}</span>`+
      `<b>${mln(m.remainTarget)}</b><span>осталось заработать</span></div>`+
    `</div>`+
    `<div class="hbar"><i class="fact" style="width:${factPct}%"></i>`+
      `<i class="proj" style="left:${factPct}%;width:${Math.max(0,landPct-factPct)}%"></i>`+
      `<i class="tgt" style="left:100%"></i></div>`+
    `<div class="hbar-leg"><span><i class="sw f"></i>заработано ${mln(m.realizedRev)}</span>`+
      `<span><i class="sw p"></i>прогноз добавит ${mln(Math.max(0,m.landing-m.realizedRev))}</span>`+
      `<span><i class="sw g"></i>по прогнозу не хватит ${mln(gap)}</span></div></div>`);

  // KPI
  const onP=m.onPlan, remDays=m.remaining.length, spread=remDays?Math.abs(m.tailCum)/remDays:0;
  H.push(`<div class="kpis">`);
  H.push(kpi("Заработано",mln(m.realizedRev),`${pctA(m.realizedRev/m.T)} цели — ${m.realized.length} дн из ${m.DIM}`));
  H.push(kpi("Идём к плану",onP==null?"—":pctA(onP),
    onP==null?"нет факта":(onP>=1?"опережаем план по прошедшим дням":"отстаём по прошедшим дням"),
    onP==null?"":sigClass(onP)));
  H.push(kpi("Хвост накоплен",sths(-m.tailCum),
    m.tailCum>0?`чтобы закрыть — по +${ths(spread)} к плану каждого из ${remDays} оставшихся дней`
      :`идём с запасом — остаток можно вести спокойнее (≈ −${ths(spread)}/день)`,
    m.tailCum>0?"bad":"good"));
  if(m.futureDays.length&&m.needPerDay>0)
    H.push(kpi("Нужный темп на остаток",`${ths(m.needPerDay)}/день`,
      `текущий ~${ths(m.currentPace)}/день · нужен ${pct(m.paceGap)} (${m.futureDays.length} дн вперёд)`,
      m.paceGap>0.05?"bad":m.paceGap>0.001?"warn":"good"));
  H.push(`</div>`);

  // уточнить
  const outl=(cal.outliers||[]).map(x=>x.slice(8)+"."+x.slice(5,7)).join(", ");
  const todos=[`<li><b>Историческая дневная выгрузка</b> — чем больше месяцев, тем точнее коэффициенты дней недели (снимет «допущение»).</li>`];
  if(outl) todos.push(`<li><b>Событие ${outl}?</b> Аномалия ×~2 к будням исключена из калибровки — подтвердить у админов, была ли акция/событие.</li>`);
  if(d.park==="iyun"){
    todos.push(`<li><b>Парк открыт 17.06 (&lt;1 мес)</b> — выручка на launch-рампе (растёт), коэффициенты дней недели ПРЕДВАРИТЕЛЬНЫЕ; калибровка на июнь+июль.</li>`);
    todos.push(`<li><b>Дневные «чеки» и «сессии»</b> — в отчётах нет → нет среднего чека и попол/сессию по дням. Запросить у администратора.</li>`);
  } else if(d.park==="piterland") todos.push(`<li><b>Питер: дневные «Кол-во чеков»</b> — сейчас средний чек по дням недоступен (N/A).</li>`);
  else todos.push(`<li><b>Даты акций/событий месяца</b> — отмечаются в блоке «Активности» (см. ниже), учитываются вручную.</li>`);
  todos.push(`<li><b>Праздники/акции следующих месяцев</b> — добавить в календарь при перекате.</li>`);
  H.push(`<div class="todo"><h3>Что загрузить / уточнить (чтобы точность росла)</h3><ul>${todos.join("")}</ul></div>`);

  // недели
  H.push(`<h2>По неделям</h2>`);
  m.weeks.forEach(w=>{
    const r=w.partOfPlan>0?w.fact/w.partOfPlan:null;
    const from=w.days[0].dd, to=w.days[w.days.length-1].dd, mg=RU_MG[d.month.slice(5)];
    const open=w.days.some(x=>x.status!=null);
    H.push(`<details class="week"${open?" open":""}><summary class="wk">`+
      `<div class="wk-l1"><span class="wk-name">Неделя ${w.idx}</span><span class="wk-dates">${from}–${to} ${mg}</span>`+
        `<span class="wk-chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></span></div>`+
      `<div class="wk-l2"><span class="s"><span class="k">план</span><b>${mln(w.plan)}</b></span>`+
        (w.hasFact?`<span class="s"><span class="k">факт</span><b>${mln(w.fact)}</b></span>`
                  :`<span class="s"><span class="k">надо (с хвостом)</span><b>${mln(w.need)}</b></span>`)+
        (w.hasFact?`<span class="s"><span class="k">отклонение (по пришедшим)</span><b class="${w.delta>=0?'good':'bad'}">${sths(w.delta)}</b></span>`:``)+
      `</div></summary>`);
    H.push(`<div class="wk-body"><table><thead><tr><th class="day">день</th><th>план</th><th>факт</th><th>надо</th><th style="width:120px">прогресс</th></tr></thead><tbody>`);
    w.days.forEach(x=>{
      const cls=[x.weekend?"wknd":"",x.iso===lastFact?"today":""].filter(Boolean).join(" ");
      const rD=x.full?x.fact/x.plan:null, sc=sigClass(rD);
      const chk=x.chk?`<span class="chk">чек ${nf.format(Math.round(x.chk))}</span>`:"";
      const badges=x.acts.map(c=>`<span class="actbadge">${c}</span>`).join("");
      let factCell,needCell,progCell;
      if(x.full){factCell=`${ths(x.fact)}${chk}`+(x.outlier?` <span class="prov">событие</span>`:"");needCell=`<span class="muted">—</span>`;
        const fw=Math.min(100,x.fact/x.plan*100);
        progCell=`<div class="prog"><i class="fa ${sc}" style="width:${fw}%"></i></div>`;}
      else if(x.status==="partial"){factCell=`${ths(x.fact)} <span class="prov">неполный</span>`;needCell=`<span class="need">${ths(x.need)}</span>`;progCell=`<span class="muted">—</span>`;}
      else{factCell=`<span class="muted">—</span>`;needCell=`<span class="need">${ths(x.need)}</span>`;progCell=`<span class="muted">—</span>`;}
      H.push(`<tr class="${cls}"><td class="day">${x.dd} <span class="dow">${x.dowRu}</span>`+
        (x.holiday?`<span class="tag">празд.</span>`:"")+badges+`</td>`+
        `<td>${ths(x.plan)}</td><td>${factCell}</td><td>${needCell}</td><td>${progCell}</td></tr>`);
    });
    H.push(`</tbody></table>`);
    if(w.leftDays>0 && w.hasFact)
      H.push(`<div class="wk-foot">Осталось в неделе ${w.leftDays} дн — «надо» с учётом хвоста: <b>${mln(w.need)}</b> (недобор прошедших дней добавлен к плану будущих).</div>`);
    H.push(`</details>`);
  });

  // сводка
  H.push(`<h2>Сводка по неделям</h2><div class="sumcard">`);
  m.weeks.forEach(w=>{
    const r=w.partOfPlan>0?w.fact/w.partOfPlan:null, sc=sigClass(r);
    const faW=w.hasFact?Math.min(100,w.fact/w.plan*100):0;
    const from=w.days[0].dd,to=w.days[w.days.length-1].dd,mg=RU_MG[d.month.slice(5)];
    H.push(`<div class="sumrow"><div class="nm">Неделя ${w.idx}<small>${from}–${to} ${mg}</small></div>`+
      `<div class="sumbar"><i class="fa ${sc}" style="width:${faW}%"></i></div>`+
      `<div class="amt">${w.hasFact?`<b>${mln(w.fact)}</b>`:`<span class="muted">ждём</span>`}<br><span style="font-size:11px">план ${mln(w.plan)}</span></div>`+
      `<div class="dl ${w.hasFact?(w.delta>=0?'good':'bad'):'muted'}">${w.hasFact?sths(w.delta):"—"}</div></div>`);
  });
  const ld=m.landing/m.T-1, ldc=sigClass(m.landing/m.T);
  H.push(`<div class="sumrow total"><div class="nm">Месяц</div>`+
    `<div class="sumbar"><i class="fa ${ldc}" style="width:${Math.min(100,m.landing/m.T*100)}%"></i></div>`+
    `<div class="amt"><b>прогноз ${mln(m.landing)}</b><br><span style="font-size:11px">цель ${mln(m.T)}</span></div>`+
    `<div class="dl ${ldc}">${pct(ld)}</div></div>`);
  // распределение фактических дней — ВНУТРИ Сводки
  const fd=m.days.filter(x=>x.full);
  if(fd.length){
    const g=fd.filter(x=>x.fact/x.plan>=GOOD).length;
    const yl=fd.filter(x=>{const r=x.fact/x.plan;return r>=OK&&r<GOOD;}).length;
    const rd=fd.filter(x=>x.fact/x.plan<OK).length;
    const P=k=>Math.round(k/fd.length*100);
    H.push(`<div class="dayblock"><div class="dbhead">Дни по плану<span>факт — ${fd.length} дн</span></div>`+
      `<div class="dbbar">${g?`<i class="good" style="width:${P(g)}%"></i>`:''}${yl?`<i class="warn" style="width:${P(yl)}%"></i>`:''}${rd?`<i class="bad" style="width:${P(rd)}%"></i>`:''}</div>`+
      `<div class="dblegend"><span class="good"><b>${g}</b> выше плана · ${P(g)}%</span>`+
      `<span class="warn"><b>${yl}</b> близко 85–99% · ${P(yl)}%</span>`+
      `<span class="bad"><b>${rd}</b> ниже 85% · ${P(rd)}%</span></div></div>`);
  }
  H.push(`</div>`);   // /sumcard

  // журнал прогноза (раскрывающийся, по умолчанию открыт)
  if((d.journal||[]).length){
    H.push(`<details class="sect" open><summary class="sect-h">Журнал прогноза <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></summary><div class="jcard">`);
    let prev=null;
    d.journal.forEach(s=>{
      const cls=sigClass(s.landing_pct);
      const arrow=prev==null?"":(s.landing>prev+5000?`<span class="good">▲</span>`:(s.landing<prev-5000?`<span class="bad">▼</span>`:`<span class="muted">→</span>`));
      H.push(`<div class="jrow"><div class="jd">${+s.date.slice(8)} ${RU_MG[d.month.slice(5)]}</div>`+
        `<div class="jz">зараб. ${mln(s.realized)}</div>`+
        `<div class="jf">${mln(s.landing)} ${arrow}</div>`+
        `<div class="sumbar"><i class="fa ${cls}" style="width:${Math.min(100,s.landing_pct*100)}%"></i></div>`+
        `<div class="jp ${cls}">${Math.round(s.landing_pct*100)}%</div>`+
        `<div class="ja">${s.achievable?`<span class="good">✓ достижима</span>`:`<span class="bad">⚠ риск</span>`}</div></div>`);
      prev=s.landing;
    });
    H.push(`</div><p class="legend">Прогноз выручки на конец каждого дня (коэффициенты фиксированы — видно, как факт двигал прогноз и оценку достижимости). ▲/▼ — сдвиг ко вчерашнему.</p></details>`);
  }

  // метрики по дням (раскрывающийся, свёрнут) — колонки адаптивные под парк
  const md=m.days.filter(x=>x.status), dmap={}; (DATA.days||[]).forEach(z=>dmap[z.date]=z);
  const MET=[
    {k:'chk', h:'ср. чек',       f:z=>z.chk?nf.format(Math.round(z.chk)):null},
    {k:'sessions', h:'сессии',   f:z=>z.sessions!=null?nf.format(z.sessions):null},
    {k:'topups', h:'пополнения', f:z=>z.topups!=null?nf.format(z.topups):null},
    {k:'pps', h:'попол/сессию',  f:z=>(z.topups!=null&&z.sessions)?(z.topups/z.sessions).toFixed(2):null},
    {k:'new', h:'новые гости',   f:z=>z.new!=null?nf.format(z.new):null},
    {k:'promo', h:'акция 300₽',  f:z=>z.promo!=null?nf.format(z.promo):null},
    {k:'reviews', h:'отзывы',    f:z=>(z.rev_y!=null||z.rev_vk!=null)?`${(z.rev_y||0)+(z.rev_vk||0)}`:null},
  ].filter(c=>md.some(x=>c.f(dmap[x.iso]||{})!=null));
  const head=`<th class="day">день</th><th>выручка</th>`+MET.map(c=>`<th class="nowrap">${c.h}</th>`).join("")+`<th class="nowrap">нал / безнал</th>`;
  H.push(`<details class="sect"><summary class="sect-h">Метрики по дням <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg></summary><div class="sumcard"><table><thead><tr>${head}</tr></thead><tbody>`);
  md.forEach(x=>{
    const z=dmap[x.iso]||{};
    const tot=(z.cash||0)+(z.cashless||0);
    const cc=tot?`${Math.round(z.cash/tot*100)} / ${Math.round(z.cashless/tot*100)}%`:`<span class="muted">—</span>`;
    const cells=MET.map(c=>{const v=c.f(z);return `<td>${v!=null?v:'<span class="muted">—</span>'}</td>`;}).join("");
    H.push(`<tr class="${x.weekend?'wknd':''}"><td class="day nowrap">${x.dd} <span class="dow">${x.dowRu}</span>${x.status==='partial'?' <span class="prov">неполн.</span>':''}</td><td>${ths(x.fact)}</td>${cells}<td class="nowrap">${cc}</td></tr>`);
  });
  const leg = MET.some(c=>c.k==='pps') ? `<b>Попол/сессию</b> — пополнений на кассовую сессию с пополнением (≈ попол/визит, канон ~1,1). Ср.чек = выручка ÷ все чеки.`
    : MET.some(c=>c.k==='new') ? `<b>Новые гости</b> — новые посетители за день (лидирующая метрика для растущего парка). <b>Акция 300₽</b> — участники «подписка+репост». Чеки/сессии/ср.чек — нет в отчётах (в долге).`
    : `Ср.чек, сессии, пополнения — N/A (нет дневной выгрузки, в долге; запросим у админа).`;
  H.push(`</tbody></table></div><p class="legend">${leg}</p></details>`);

  // правила цвета прогресса
  H.push(`<h2>Прогресс дня</h2><div class="rules">`+
    `<span class="r"><i class="d g"></i>план выполнен — ≥100%</span>`+
    `<span class="r"><i class="d a"></i>близко — 85–99%</span>`+
    `<span class="r"><i class="d r"></i>недобор — ниже 85%</span></div>`);

  // активности / гипотезы
  if((d.activities||[]).length){
    H.push(`<h2>Активности и гипотезы</h2><div class="actcard">`);
    d.activities.forEach(a=>{
      const dd=a.days.map(iso=>m.days.find(x=>x.iso===iso)).filter(Boolean);
      const full=dd.filter(x=>x.full);
      let res,rc="muted";
      if(!full.length) res= dd.some(x=>x.status==="partial")?"идёт (ждём полный факт)":"впереди";
      else{const rr=full.reduce((a,x)=>a+x.fact,0)/full.reduce((a,x)=>a+x.plan,0);
        res=`${pct(rr-1)} к плану`; rc=rr>=GOOD?"good":rr>=OK?"warn":"bad";}
      const dl=a.days.map(iso=>+iso.slice(8)).join(", ");
      H.push(`<div class="actrow"><span class="code">${a.code}</span>`+
        `<div class="an">${a.name}<small>дни: ${dl} ${RU_MG[d.month.slice(5)]}</small></div>`+
        `<div class="res ${rc}">${res}</div></div>`);
    });
    H.push(`</div><p class="legend">Бейдж активности стоит у дней, когда она работала; здесь — её результат к плану по этим дням.</p>`);
  }

  // коэффициенты
  H.push(`<h2>Коэффициенты дней недели <span class="prov assume">${cal.clean_n} дн · уточнятся с историей</span></h2><div class="coefwrap">`);
  const maxc=Math.max(...d.dow_coef.map(c=>c||0),1.3), midpos=1/maxc*100;
  DOW_RU.forEach((dn,i)=>{const c=d.dow_coef[i],src=d.dow_src[i],n=d.dow_n[i],w=c?c/maxc*100:0;
    H.push(`<div class="coefrow"><span>${dn}</span>`+
      `<div class="coefbar"><i class="${src==='данные'?'data':'oper'}" style="width:${w}%"></i><span class="mid" style="left:${midpos}%"></span></div>`+
      `<span style="text-align:right;font-variant-numeric:tabular-nums">${c?c.toFixed(2):"—"}</span>`+
      `<span class="src ${src==='данные'?'data':'oper'}">${src==='данные'?`факт (n=${n})`:`админы (n=${n})`}</span></div>`);});
  const wb=cal.weekday_base||0, od=cal.oper_days||[];
  let arith=`<b>Как получены:</b> будни Ср/Чт/Пт — среднее по факту, база ≈ <b>${ths(wb)}</b>/день. Выходные Сб/Вс — по факту (коэф ${d.dow_coef[5]} и ${d.dow_coef[6]}). `;
  if(od.includes("Вт")) arith+=`<b>Вторник</b> = будни + надбавка ${ths(cal.tue_bonus)} (админы, мало данных) → ${d.dow_coef[1]}. `;
  if(od.includes("Пн")) arith+=`<b>Понедельник</b> = будни ×${cal.mon_dip} (админы) → ${d.dow_coef[0]}. `;
  if(!od.length) arith+=`Остальные дни — тоже из факта (данных достаточно). `;
  if((cal.outliers||[]).length) arith+=`Событие ${(cal.outliers||[]).map(x=>x.slice(8)+"."+x.slice(5,7)).join(", ")} исключено из калибровки (в факте осталось). `;
  arith+=`При &lt;${cal.min_obs} наблюдений по дню — временно логика админов, дальше факт.`;
  H.push(`<div class="arith">${arith}</div>`);
  H.push(`<p class="legend">Полоса — величина коэффициента (риска — уровень «1.00», средний день). Источник справа: <b>факт</b> или <b>логика админов</b> (пока мало данных).</p></div>`);

  H.push(`<p class="foot">`+
    `<b>План дня</b> = цель × коэффициент дня недели, сумма всех дней = ${mln(m.T)} (не «цель ÷ ${m.DIM}»).<br>`+
    `<b>«Надо»</b> — сколько нужно в будущий день, чтобы выйти на цель: недобор прошедших дней перераспределён по остатку (форма недели сохранена). «Надо − план» = добавленный хвост.<br>`+
    `<b>Прогноз выручки</b> — куда придём при текущем темпе (событие из темпа исключено). Достижимость — если для цели нужны дни выше лучшего обычного.</p>`);

  document.getElementById("app").innerHTML=H.join("");
}
function kpi(l,v,n,cls){return `<div class="kpi"><div class="lab">${l}</div><div class="val ${cls||""}">${v}</div>${n?`<div class="note">${n}</div>`:""}</div>`;}
try{render();}catch(e){document.getElementById("app").innerHTML=`<p class="muted">Ошибка: ${e.message}</p>`;console.error(e);}
</script>
</body>
</html>
