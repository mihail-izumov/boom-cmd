name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # URL gated Apps Script — не секрет (виден в бандле как endpoint),
          # держим как repo Variable. Парольная фраза сюда НЕ попадает.
          VITE_PROJECTS_API: ${{ vars.VITE_PROJECTS_API }}
          VITE_ANALYTICS_API: ${{ vars.VITE_ANALYTICS_API }}
          VITE_MATERIALS_API: ${{ vars.VITE_MATERIALS_API }}
          VITE_DAILY_API: ${{ vars.VITE_DAILY_API }}
          VITE_GOALS_API: ${{ vars.VITE_GOALS_API }}
          VITE_REPORT_API: ${{ vars.VITE_REPORT_API }}
          # Носитель ТВ-панелей /media/turbo/ (DRV-10). Отдельный деплой Apps
          # Script и ПУБЛИЧНЫЙ (без ключа) — страница висит на экране в зале,
          # вводить фразу доступа некому. Тем же Variable, не Secret.
          VITE_TURBO_API: ${{ vars.VITE_TURBO_API }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ⚠ Ждать дольше 10 минут НЕЛЬЗЯ. 06.08 пробовали поднять `timeout` до 30 мин —
      # action молча срезает его до максимума и пишет в лог
      # «timeout value is greater than the allowed maximum - timeout set to the
      # maximum of 600000 milliseconds». То есть переждать медленный деплой не выйдет
      # в принципе: если Pages не уложился в 10 минут, шаг покраснеет, даже когда сам
      # деплой на их стороне дойдёт до конца.
      #
      # Единственный рычаг — ВЕС АРТЕФАКТА. 06.08 он был 22 МБ, из них 19 МБ — три
      # JPEG размером до 1904×13182 px; Pages жевал такое дольше десяти минут.
      # После пережатия до ширины 2000 px артефакт стал 5,7 МБ. Правило на будущее:
      # растёт время деплоя — смотреть `du -sh dist`, а не крутить таймауты.
      - id: deployment
        uses: actions/deploy-pages@v4
