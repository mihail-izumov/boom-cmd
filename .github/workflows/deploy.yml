name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # URL gated Apps Script — не секрет (виден в бандле как endpoint),
          # держим как repo Variable. Парольная фраза сюда НЕ попадает.
          VITE_PROJECTS_API: ${{ vars.VITE_PROJECTS_API }}
          VITE_ANALYTICS_API: ${{ vars.VITE_ANALYTICS_API }}
          VITE_MATERIALS_API: ${{ vars.VITE_MATERIALS_API }}
          VITE_DAILY_API: ${{ vars.VITE_DAILY_API }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
